{% extends 'auth/base.html' %}

{% block title %}Create Account - {{ current_tenant.agency_name }}{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h3 class="fw-extrabold text-dark mb-1">Create Account</h3>
    <p class="text-muted small">Join {{ current_tenant.agency_name }} and start booking your trips</p>
</div>

<form method="POST">
    {% csrf_token %}

    <div class="row g-3 mb-3">
        <div class="col-6">
            <label class="form-label small fw-bold text-muted">First Name</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="first_name" class="form-control border-start-0 ps-0" placeholder="John" required>
            </div>
        </div>
        <div class="col-6">
            <label class="form-label small fw-bold text-muted">Last Name</label>
            <input type="text" name="last_name" class="form-control" placeholder="Doe">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Email Address</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="you@email.com" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Mobile Number</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-phone"></i></span>
            <input type="tel" name="mobile" class="form-control border-start-0 ps-0" placeholder="+880 1XXXXXXXXX">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Password</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" id="pw1" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required minlength="6">
            <button class="btn btn-outline-secondary bg-light text-muted border-start-0" type="button" onclick="togglePasswordVisibility('pw1', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Confirm Password</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="confirm_password" id="pw2" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required minlength="6">
            <button class="btn btn-outline-secondary bg-light text-muted border-start-0" type="button" onclick="togglePasswordVisibility('pw2', this)">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>


    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-6 rounded-3 shadow-sm mb-3">
        <i class="fa-solid fa-user-plus me-2"></i> Create My Account
    </button>
</form>

<div class="text-center mt-3 pt-3 border-top">
    <p class="text-muted small mb-0">Already have an account?
        <a href="{% url 'accounts:login' %}" class="fw-bold text-primary text-decoration-none">Sign In</a>
    </p>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const p1 = document.getElementById('pw1').value;
        const p2 = document.getElementById('pw2').value;
        if (p1 !== p2) {
            e.preventDefault();
            alert('Passwords do not match!');
        }
    });
</script>
{% endblock %}
