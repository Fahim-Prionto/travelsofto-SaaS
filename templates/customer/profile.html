{% extends 'customer/base.html' %}

{% block title %}Account Profile - Softobro Travel{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm p-4 mx-auto" style="max-width: 680px;">
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
        <div class="stat-icon primary" style="width: 48px; height: 48px;">
            <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
            <h4 class="fw-extrabold m-0 text-dark">My Account Profile Settings</h4>
            <p class="text-muted small mb-0">Update personal information and contact details</p>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ request.user.first_name }}">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ request.user.last_name }}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Email Address (Primary Login)</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="email" class="form-control bg-light" value="{{ request.user.email }}" readonly disabled>
            </div>
            <small class="text-muted">Primary account email is verified and cannot be changed.</small>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-muted">Mobile Number</label>
            <input type="text" name="mobile" class="form-control" value="{{ request.user.mobile|default:'' }}" placeholder="+1 (555) 019-2834">
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2 pt-3 border-top">
            <button type="submit" class="btn btn-primary px-4 fw-bold">
                <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
